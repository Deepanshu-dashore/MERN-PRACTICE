<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="weather-container">
        <h2>Live Weather App</h2>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city (e.g., Delhi, Mumbai)">
            <button id="searchBtn" onclick="searchWeather()">Search</button>
        </div>

        <div class="error-msg" id="errorMsg"></div>

        <div class="weather-info" id="weatherInfo">
            <div class="city-name" id="cityNameDisplay">City Name</div>
            <div class="temp" id="tempDisplay">--°C</div>
            <div class="details">
                <span id="windDisplay">Wind: -- km/h</span>
                <span id="conditionDisplay">Condition: Clear</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
